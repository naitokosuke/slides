packages:
  - src
  - demo

overrides:
  monaco-editor: catalog:monaco

ignoredBuiltDependencies:
  - esbuild

catalogs:
  # Slidev プレゼンテーション環境
  slidev-presentation:
    "@slidev/cli": ^53.0.0
    "@slidev/theme-default": latest
    "@slidev/theme-seriph": latest
    "@slidev/types": ^53.0.0
    "@iconify-json/logos": ^1.2.17
    "@iconify-json/material-icon-theme": ^1.2.73
    "@iconify-json/material-symbols": ^1.2.39
    "@iconify-json/ic": ^1.2.4
    "@iconify-json/noto": ^1.2.9
    playwright-chromium: ^1.64.1
    "@vueuse/integrations": ^15.0.0
    qrcode: ^1.5.4
    "@unocss/preset-web-fonts": ^66.11.0

  # Monaco Editor
  monaco:
    monaco-editor: ^0.56.0

  # デモアプリ依存関係
  demo-deps:
    "@nuxt/content": ^3.16.2
    "@nuxt/eslint": 1.17.0
    "@nuxtjs/i18n": ^10.0.6
    better-sqlite3: ^13.0.3
    eslint: ^10.13.0
    nuxt: ^4.6.2
    vue: ^3.5.44
    vue-router: ^5.4.0
    pinia: ^3.0.3
    "@pinia/colada": ^0.17.1
    nuxt-typed-router: ^4.0.1

  # 開発・品質ツール
  dev-tools:
    prettier: ^3.9.10
    # typescript-eslint does not support TypeScript 7 yet
    typescript: ^6.0.3
    prettier-plugin-slidev: ^1.0.5
    textlint: ^15.2.1
    textlint-filter-rule-comments: ^1.2.2
    textlint-filter-rule-node-types: ^1.1.0
    textlint-rule-no-dropping-the-ra: ^3.0.0
    textlint-rule-preset-ai-writing: ^1.1.0
    textlint-rule-preset-ja-spacing: ^3.0.4

allowBuilds:
  better-sqlite3: true
  esbuild: true
  playwright-chromium: true
  unrs-resolver: true
