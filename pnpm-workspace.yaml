  utils:
    "@braintree/sanitize-url": ^7.1.2

  types:
    "@types/node": ^20.19.43
    "@types/prompts": ^2.4.9
    "@types/seedrandom": ^3.0.8
    "@cloudflare/workers-types": ^4.20260702.1

  tooling:
    typescript: ^5.9.3
    rimraf: ^6.1.3
    execa: ^9.6.1
    fast-glob: ^3.3.3
    prettier: ^3.9.6
    taze: ^0.14.3
    pnpm: ^11.25.0

  misc:
    gray-matter: ^4.0.3
    prompts: ^2.4.2
    qrcode: ^1.5.4
    seedrandom: ^3.0.5

  site:
    nuxt: ^4.5.2
    vue: ^3.5.42
    vue-router: ^5.3.1
    "@nuxt/fonts": ^0.14.0
    "@unocss/nuxt": ^66.9.2
    unocss: ^66.9.2

  content:
    canvas-confetti: ^1.9.4
    gsap: ^3.15.0
    js-confetti: ^0.12.0
    "@unocss/preset-icons": ^66.9.2

allowBuilds:
  esbuild: true
  playwright-chromium: true
  unrs-resolver: true
