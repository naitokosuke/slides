minimumReleaseAge: 1440

packages:
  - "*/src"
  # 2025-10-25 has its own pnpm-workspace.yaml
  - "!2025-10-25/src"
  - "worker"
  - "site"

catalogs:
  slidev:
    "@slidev/cli": ^53.0.0
    "@slidev/client": ^53.0.0
    "@slidev/theme-default": latest
    "@slidev/theme-seriph": latest
    "@slidev/types": ^53.0.0
    vue: ^3.5.44
    vue-router: ^5.4.0
    "@vueuse/integrations": ^15.0.0
    prettier-plugin-slidev: ^1.0.5
    unocss: ^66.11.0
    markdown-it-magic-link: ^0.1.4
    playwright-chromium: ^1.64.1

  iconify:
    "@iconify-json/carbon": ^1.2.29
    "@iconify-json/devicon": ^1.2.71
    "@iconify-json/healthicons": ^1.2.14
    "@iconify-json/logos": ^1.2.17
    "@iconify-json/material-icon-theme": ^1.2.73
    "@iconify-json/mdi": ^1.2.3
    "@iconify-json/noto": ^1.2.9
    "@iconify-json/openmoji": ^1.2.29
    "@iconify-json/simple-icons": ^1.2.100
    "@iconify-json/skill-icons": ^1.2.4
    "@iconify-json/twemoji": ^1.2.5
    "@iconify-json/uim": ^1.2.3
    "@iconify/json": ^2.2.547

  lint:
    vize: ^0.549.0

  script:
    gunshi: ^0.37.3
    "@gunshi/docs": 0.37.3

  utils:
    "@braintree/sanitize-url": ^7.1.2

  types:
    "@types/node": ^26.6.5
    "@types/prompts": ^2.4.9
    "@types/seedrandom": ^3.0.8
    "@cloudflare/workers-types": ^5.20261024.1

  tooling:
    vite-plus: 1.4.0
    typescript: ^7.0.2
    rimraf: ^6.1.3
    execa: ^10.2.1
    fast-glob: ^3.3.3
    prettier: ^3.9.10
    taze: ^21.3.0
    pnpm: ^12.15.0
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0

  misc:
    gray-matter: ^4.0.3
    prompts: ^2.4.2
    qrcode: ^1.5.4
    seedrandom: ^3.0.5

  site:
    nuxt: ^4.6.2
    vue: ^3.5.44
    vue-router: ^5.4.0
    "@nuxt/fonts": ^1.1.0
    "@unocss/nuxt": ^66.11.0
    unocss: ^66.11.0

  content:
    canvas-confetti: ^1.9.4
    gsap: ^3.15.0
    js-confetti: ^0.13.1
    "@unocss/preset-icons": ^66.11.0

allowBuilds:
  esbuild: true
  playwright-chromium: true
  pnpm: true
  unrs-resolver: true
overrides:
  vite@*: catalog:tooling
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
