minimumReleaseAge: 1440

packages:
  - "*/src"
  # 2025-10-25 has its own pnpm-workspace.yaml
  - "!2025-10-25/src"
  - "worker"
  - "site"

catalogs:
  slidev:
    "@slidev/cli": ^52.19.1
    "@slidev/client": ^52.19.1
    "@slidev/theme-default": latest
    "@slidev/theme-seriph": latest
    vue: ^3.5.42
    vue-router: ^5.3.1
    vue-tsc: ^2.2.12
    "@vueuse/integrations": ^13.9.0
    prettier-plugin-slidev: ^1.0.5
    unocss: ^0.61.9
    markdown-it-magic-link: ^0.1.4
    playwright-chromium: ^1.62.1

  iconify:
    "@iconify-json/carbon": ^1.2.26
    "@iconify-json/devicon": ^1.2.62
    "@iconify-json/healthicons": ^1.2.13
    "@iconify-json/logos": ^1.2.13
    "@iconify-json/material-icon-theme": ^1.2.70
    "@iconify-json/mdi": ^1.2.3
    "@iconify-json/noto": ^1.2.7
    "@iconify-json/openmoji": ^1.2.29
    "@iconify-json/simple-icons": ^1.2.94
    "@iconify-json/skill-icons": ^1.2.4
    "@iconify-json/twemoji": ^1.2.5
    "@iconify-json/uim": ^1.2.3
    "@iconify/json": ^2.2.525

  lint:
    vize: ^0.390.0
    oxfmt: ^0.66.0

  script:
    gunshi: ^0.27.6
