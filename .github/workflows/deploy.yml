name: Deploy to Cloudflare R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed slides
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=all" >> $GITHUB_OUTPUT
            echo "Manual run, rebuilding all"
            exit 0
          fi

          # Diff against the last successful deploy so changes from failed runs are not dropped
          BASE=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
          BASE=${BASE:-${{ github.event.before }}}
          echo "Diff base: $BASE"
          DIFF=$(git diff --name-only $BASE ${{ github.sha }})

          # Get changed slide folders (YYYY-MM-DD or YYYY-MM-DD-suffix pattern)
          CHANGED=$(echo "$DIFF" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-zA-Z0-9]+)?' | sort -u | tr '\n' ',' | sed 's/,$//' || true)

          # Check if shared files changed (requires full rebuild)
          SHARED_CHANGED=$(echo "$DIFF" | grep -E '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|scripts/|public/|worker/)' || true)

          # Check if only site/ changed (homepage only rebuild)
          SITE_CHANGED=$(echo "$DIFF" | grep -E '^site/' || true)

          if [ -n "$SHARED_CHANGED" ]; then
            echo "changed=all" >> $GITHUB_OUTPUT
            echo "Shared files changed, rebuilding all"
          elif [ -n "$SITE_CHANGED" ] && [ -z "$CHANGED" ]; then
            echo "changed=site-only" >> $GITHUB_OUTPUT
            echo "Only site/ changed, rebuilding homepage only"
          elif [ -z "$CHANGED" ]; then
            echo "changed=none" >> $GITHUB_OUTPUT
            echo "No slide changes detected"
          else
            echo "changed=$CHANGED" >> $GITHUB_OUTPUT
            echo "Changed slides: $CHANGED"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.changed != 'none'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed != 'none'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
        if: steps.changes.outputs.changed != 'none'

      - name: Install Playwright browsers
        if: steps.changes.outputs.changed != 'none' && steps.changes.outputs.changed != 'site-only'
        run: pnpm exec playwright install chromium

      - name: Build slides
        if: steps.changes.outputs.changed != 'none' && steps.changes.outputs.changed != 'site-only'
        run: pnpm build:ci
        env:
          CHANGED_SLIDES: ${{ steps.changes.outputs.changed }}

      - name: Build homepage only
        if: steps.changes.outputs.changed == 'site-only'
        run: |
          mkdir -p dist
          pnpm --filter slides-site run generate
          cp -r site/.output/public/* dist/

      - name: Install rclone
        if: steps.changes.outputs.changed != 'none'
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        if: steps.changes.outputs.changed != 'none'
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          EOF

      - name: Upload to R2
        if: steps.changes.outputs.changed != 'none'
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "all" ]; then
            # Full sync for full rebuilds
            rclone sync dist/ r2:slides/ --progress
          else
            # Copy only changed folders + homepage for incremental builds
            rclone copy dist/ r2:slides/ --progress
          fi

      - name: Deploy Worker
        if: steps.changes.outputs.changed != 'none'
        working-directory: worker
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
